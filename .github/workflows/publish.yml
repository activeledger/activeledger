name: Publish packages

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 4.2.0). Leave blank to publish whatever's currently committed in package.json."
        required: false
  # release.yml calls this directly rather than relying on the tag it pushes
  # to trigger the `push: tags` above. GitHub does not start new workflow runs
  # from events created with the default GITHUB_TOKEN, so that tag push is
  # invisible to this workflow - v4.5.8 was tagged successfully and published
  # nothing until it was dispatched by hand. A workflow_call happens inside
  # the caller's run, so the restriction does not apply.
  workflow_call:
    inputs:
      version:
        description: "Version to publish, without the leading v"
        required: false
        type: string

permissions:
  # contents: write, not read - creating a GitHub Release writes to the repo.
  # This was `read`, which is why adding a release step would have failed even
  # if one had existed.
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # secrets can't be referenced directly in a step's `if:` - the
    # "secrets" context isn't in the allowed-contexts list for
    # expressions there (confirmed via actionlint; this exact mistake in
    # the original PR broke workflow registration entirely - every push,
    # tag or not, failed immediately with 0 jobs run, since GitHub
    # refuses to even register a workflow file that fails schema
    # validation). Routing it through env: first works around that -
    # env: is an allowed context in `if:`.
    env:
      NPM_TOKEN_SET: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@activeledger"

      - name: Install workspace
        run: npm ci

      # SAFETY NET, not the primary path. Since release.yml was added, a
      # release bumps and commits the versions BEFORE tagging, so a tag
      # normally already carries the right numbers and this step is a no-op
      # that sets them to what they already are. It stays for a hand-cut tag,
      # where it is the only thing standing between a manual `git tag` and a
      # publish of the previous version's number.
      #
      # It cannot fix the source tree or the tag itself - both already exist by
      # the time this runs, which is exactly why release.yml exists.
      #
      # A pushed tag is the source of truth for what gets published - this
      # makes publishing correct regardless of whether the manifests were
      # bumped before tagging (they'd drifted from every tag since
      # v4.0.0, which silently broke every release's publish step). Runs
      # before the build so the CLI's --version output (baked in at build
      # time from package.json, see activeledger/src/post-build.js) matches
      # too. workflow_dispatch's optional version input covers a manual
      # republish of an arbitrary version without needing a new tag.
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/set-version.mjs "${GITHUB_REF_NAME#v}"

      # Deliberately not gated on github.event_name: under workflow_call that
      # reports the CALLER's event, so a check for 'workflow_dispatch' here is
      # both wrong and accidentally right depending on how release.yml was
      # started. inputs.version is empty on a tag push and set on either of
      # the other two triggers, which is exactly the distinction that matters.
      - name: Set version from workflow input
        if: inputs.version != ''
        run: node scripts/set-version.mjs "${{ inputs.version }}"

      - name: Build all packages
        run: npm run build

      - name: Publish to GitHub Packages
        run: npm publish --workspaces --access public --registry https://npm.pkg.github.com/
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Re-runs setup-node pointed at npmjs.org - it (re)writes the auth
      # line in ~/.npmrc for whichever registry-url you give it, so this
      # has to happen as its own step, after the GitHub Packages publish
      # above has already finished with it, not before (the second call
      # would otherwise clobber the GitHub Packages auth line first).
      #
      # Guarded on the NPM_TOKEN secret actually being set: this repo's
      # npmjs.org account access is being restored separately, so the
      # secret won't exist yet on the first few tags after this is wired
      # in. Skipping cleanly here (rather than failing) means GitHub
      # Packages keeps publishing normally in the meantime - add
      # secrets.NPM_TOKEN in the repo's Settings -> Secrets and Actions
      # once the npmjs token exists to turn this on.
      - name: Setup Node (npmjs.org)
        if: ${{ env.NPM_TOKEN_SET == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          scope: "@activeledger"

      # --access public: scoped packages default to restricted, and a
      # restricted publish to npmjs would need a paid org. These have been
      # public since the 2.x era regardless, so it is belt and braces
      # rather than load-bearing - but it costs nothing and a first
      # publish of a NEW package would need it.
      - name: Publish to npmjs.org
        if: ${{ env.NPM_TOKEN_SET == 'true' }}
        run: npm publish --workspaces --access public --registry https://registry.npmjs.org/
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # A publisher's word is not evidence. lerna printed "success
      # published 17 packages" on three consecutive releases while the
      # registry was missing six of them - the same six each time, so not
      # random flakiness; it read the registry stale and reported success
      # either way. v4.5.8, v4.5.9 and v4.5.10 all shipped incomplete and
      # were only caught because someone queried npm by hand. v4.5.9 was
      # briefly missing activeutilities (the keep-alive fix) and
      # activenetwork (all the SPI work) - the two packages that release
      # existed for.
      #
      # lerna is gone now, but this check stays. The failure was npm's
      # read-after-write behaviour as much as the tool's optimism, and
      # `npm publish --workspaces` reports per package success the same
      # way. Ask the registry, republish what is missing, and fail loudly
      # if it still is not there. Republishing only the missing packages
      # avoids the E403 that a blanket re-run hits on the ones that did
      # land.
      - name: Verify every package reached npmjs, and republish what did not
        if: ${{ env.NPM_TOKEN_SET == 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -u
          target="$(node -p "require('./package.json').version")"
          echo "Target version: $target"

          missing_dirs() {
            node -e '
              const fs = require("fs");
              const https = require("https");
              const target = process.argv[1];
              const dirs = fs.readdirSync("packages");
              const check = (dir) => new Promise((resolve) => {
                let pkg;
                try {
                  pkg = JSON.parse(fs.readFileSync(`packages/${dir}/package.json`, "utf8"));
                } catch { return resolve(null); }
                if (!pkg.name || pkg.private) return resolve(null);
                const url = `https://registry.npmjs.org/${pkg.name.replace("/", "%2f")}`;
                https.get(url, { headers: { "cache-control": "no-cache" } }, (res) => {
                  let body = "";
                  res.on("data", (c) => (body += c));
                  res.on("end", () => {
                    try {
                      const meta = JSON.parse(body);
                      resolve(meta.versions && meta.versions[target] ? null : `packages/${dir}`);
                    } catch { resolve(`packages/${dir}`); }
                  });
                }).on("error", () => resolve(`packages/${dir}`));
              });
              Promise.all(dirs.map(check)).then((r) => {
                const missing = r.filter(Boolean);
                if (missing.length) console.log(missing.join(" "));
              });
            ' "$target"
          }

          for attempt in 1 2 3; do
            missing="$(missing_dirs)"
            if [ -z "$missing" ]; then
              echo "All packages are on npmjs at $target"
              exit 0
            fi
            echo "::warning::attempt $attempt - not on npmjs at $target: $missing"
            for dir in $missing; do
              # Individually, so one failure does not abort the rest, and
              # so an already-published sibling cannot 403 the whole run
              (cd "$dir" && npm publish --access public --registry https://registry.npmjs.org/) || true
            done
            # The registry needs a moment to agree with itself
            sleep 20
          done

          missing="$(missing_dirs)"
          if [ -n "$missing" ]; then
            echo "::error::still missing from npmjs at $target after 3 attempts: $missing"
            exit 1
          fi
          echo "All packages are on npmjs at $target"

      # Publishing to a registry and announcing a release are two different
      # things, and only the first was ever automated here. No version of this
      # workflow has ever created a GitHub Release - releases up to v4.4.0 were
      # made by hand alongside the tag, and when tagging became frequent during
      # the v4.5.x series that step simply stopped happening. The result was
      # six versions (v4.5.0 through v4.5.6) published to npm and GitHub
      # Packages with no release entry, so the releases page read as six
      # versions behind reality while every CI run reported success.
      #
      # Last, deliberately: a release should announce something that actually
      # shipped. If either publish above fails the job stops before here, so
      # there is never a release pointing at a version nobody can install.
      #
      # Idempotent, because a re-run of a tag build is an ordinary thing (the
      # npmjs step was skipped for the first few tags while its token was being
      # restored, so re-running an old tag to backfill it is expected) and
      # `gh release create` fails on an existing tag rather than no-op'ing.
      # The tag to release is either the ref that triggered this, or the one
      # release.yml just pushed for the version it handed over. Keying this on
      # the ref alone meant a run started any way other than by a tag push
      # skipped the release entirely and said nothing about it - v4.5.8's
      # GitHub Release had to be created by hand afterwards.
      - name: Resolve release tag
        id: releasetag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.version }}" ]; then
            echo "name=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: steps.releasetag.outputs.name != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.releasetag.outputs.name }}
        run: |
          # Asked of the remote, not the local clone. This job's checkout is
          # shallow and, when called from release.yml, happened before that
          # workflow pushed the tag - so `git rev-parse` here would miss a tag
          # that exists perfectly well on the remote.
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::warning::tag $TAG does not exist on the remote - skipping GitHub Release"
            exit 0
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists - nothing to do"
          else
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
