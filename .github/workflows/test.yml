# Runs the test suite. Nothing did before this: publish.yml was the only
# workflow, so `npm test` only ever ran when someone remembered to run it
# locally - on code that decides consensus and repairs divergent ledger
# state.
#
# The install and build steps are not optional. The tests import from
# packages/*/src directly, but those sources import each other through the
# published @activeledger/* names, which only resolve once npm has linked
# the workspace and each package has a lib/ to resolve types against.
# Without them every single test fails on "Cannot find module
# '@activeledger/activelogger'", which reads like a broken test suite
# rather than a missing setup step.
name: Tests

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 24 (current LTS), not the 18 publish.yml used. uWebSockets.js v20.67.0 ships
      # prebuilt binaries only for Node 22, 24 and 26 (ABI 127/137/147), so
      # anything older dies at require() with "Cannot find module
      # './uws_linux_x64_108.node'" the moment a test touches httpd.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # One install for the whole workspace - npm links packages/* into the
      # root node_modules itself.
      - name: Install workspace
        run: npm ci

      # Deliberately not `npm run build` - that script ends in `npm run link`,
      # which npm-links the CLI packages globally. That is for a developer
      # machine and is pointless on a throwaway runner.
      - name: Build packages
        run: |
          for target in definitions logger utilities httpd options storage \
                        crypto activesync activep2p query contracts protocol \
                        network toolkits ledger restore hybrid; do
            echo "::group::build:$target"
            npm run "build:$target"
            echo "::endgroup::"
          done

      # Catches a package whose build output exists but which npm would
      # leave out of the tarball. v4.5.11-4.5.13 shipped activestorage
      # with no lib/ at all: on the registry, right version, resolvable,
      # and MODULE_NOT_FOUND on require. Cheap, and it runs on every PR
      # rather than only at release, so the next one cannot reach npm.
      - name: Check every package ships its entry points
        run: node scripts/check-package-contents.mjs

      - name: Run tests
        run: npm test

      # Starts four real nodes and checks what unit tests cannot: that a
      # restart keeps the recorded chain id, that a changed id will not start,
      # and that a node on another chain is not paired. The 5.7.0 release
      # shipped a pairing check that never ran on a real network because the
      # unit tests called the handler directly; this is the test that finds
      # it. Takes about a minute.
      - name: Live check, chain id on a 4-node network
        timeout-minutes: 10
        run: npx tsx tests/network/chain-live.ts

      # Neighbours pair through the signed hello, an answer is signed by the
      # node's key, and a node that does not say hello still pairs.
      - name: Live check, signed hello on a 4-node network
        timeout-minutes: 10
        run: npx tsx tests/network/hello-live.ts

      # A node that was away catches up on a quiet network, and again after a
      # crash during the catch-up.
      - name: Live check, catch-up on a 4-node network
        timeout-minutes: 10
        run: npx tsx tests/network/catchup-live.ts
