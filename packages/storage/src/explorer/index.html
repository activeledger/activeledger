<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #14181f; --muted: #667085; --line: #e4e7ec;
    --accent: #3b5bfd; --accent-ink: #ffffff; --soft: #eef1ff; --ok: #12805c; --warn: #b54708; --bad: #b42318;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1116; --panel: #161b22; --ink: #e6e9ef; --muted: #8b94a5; --line: #262d38;
      --accent: #7c93ff; --accent-ink: #0e1116; --soft: #1c2440; --ok: #3ccf9b; --warn: #f1a54b; --bad: #f97066;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e1116; --panel: #161b22; --ink: #e6e9ef; --muted: #8b94a5; --line: #262d38;
    --accent: #7c93ff; --accent-ink: #0e1116; --soft: #1c2440; --ok: #3ccf9b; --warn: #f1a54b; --bad: #f97066;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  button, input, select, textarea { font: inherit; color: inherit; }
  header { display: flex; align-items: center; gap: 16px; padding: 10px 20px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; flex-wrap: wrap; }
  .brand { font-weight: 650; letter-spacing: -.01em; display: flex; align-items: center; gap: 9px; }
  .brand img { display: block; }
  .brand span { color: var(--accent); }
  .seg { display: inline-flex; background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 2px; }
  .seg button { border: 0; background: none; padding: 5px 14px; border-radius: 7px; cursor: pointer; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px #0002; }
  .grow { flex: 1; }
  input[type=text], input[type=search], select, textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; outline: none; }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  .btn { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px; padding: 6px 14px; cursor: pointer; font-weight: 550; }
  .btn.ghost { background: none; color: var(--ink); border: 1px solid var(--line); font-weight: 400; }
  .btn:disabled { opacity: .5; cursor: default; }
  main { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: calc(100% - 55px); }
  nav { border-right: 1px solid var(--line); background: var(--panel); padding: 14px 10px; }
  nav h6 { margin: 0 8px 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
  nav h6.group:not(:first-child) { margin-top: 18px; }
  nav h6.group.head { display: flex; justify-content: space-between; align-items: center; }
  nav .mini { width: auto; padding: 2px 9px; border: 1px solid var(--line); border-radius: 7px; font-size: 12px; text-transform: none; letter-spacing: 0; color: var(--accent); }
  .chips { display: inline-flex; gap: 6px; margin-left: 4px; }
  nav .dbrow { display: flex; align-items: center; }
  nav .dbrow > button:first-child { flex: 1; min-width: 0; }
  nav .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  nav .kebab { width: auto; padding: 4px 8px; color: var(--muted); font-size: 16px; line-height: 1; border-radius: 7px; flex: none; }
  nav .kebab:hover { color: var(--ink); background: var(--bg); }
  #menu { position: fixed; z-index: 30; min-width: 190px; padding: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 28px #0003; }
  #menu button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px 12px; border-radius: 7px; cursor: pointer; }
  #menu button:hover, #menu button:focus { background: var(--bg); outline: 0; }
  #menu button.bad { color: var(--bad); }
  nav button { display: flex; width: 100%; justify-content: space-between; align-items: center; gap: 8px; text-align: left; border: 0; background: none; padding: 7px 10px; border-radius: 8px; cursor: pointer; }
  nav button:hover { background: var(--bg); }
  nav button[aria-current="true"] { background: var(--soft); color: var(--accent); font-weight: 600; }
  .tag { font-size: 11px; padding: 1px 7px; border-radius: 99px; background: var(--bg); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .tag.ok { color: var(--ok); } .tag.warn { color: var(--warn); } .tag.bad { color: var(--bad); }
  section.content { padding: 18px 22px; min-width: 0; }
  .bar { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .bar h2 { margin: 0 8px 0 0; font-size: 18px; letter-spacing: -.01em; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
  .tabs button { border: 0; background: none; padding: 8px 14px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tabs button[aria-selected="true"] { color: var(--ink); border-color: var(--accent); font-weight: 600; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-weight: 600; font-size: 12px; color: var(--muted); padding: 9px 14px; border-bottom: 1px solid var(--line); background: var(--panel); }
  td { padding: 9px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; max-width: 340px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  tr:last-child td { border-bottom: 0; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--bg); }
  .mono { font-family: var(--mono); font-size: 12.5px; }
  .muted { color: var(--muted); }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
  .pager { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; align-items: center; color: var(--muted); }
  aside.drawer { position: fixed; top: 0; right: 0; height: 100%; width: min(640px, 100%); background: var(--panel); border-left: 1px solid var(--line); box-shadow: -12px 0 32px #0003; transform: translateX(105%); transition: transform .18s ease; z-index: 10; display: flex; flex-direction: column; }
  aside.drawer.open { transform: none; }
  .drawer header { position: static; border-bottom: 1px solid var(--line); }
  .drawer .body { padding: 16px 20px; overflow: auto; flex: 1; }
  pre.json { margin: 0; font: 12.5px/1.5 var(--mono); white-space: pre-wrap; word-break: break-word; }
  .k { color: var(--accent); } .s { color: var(--ok); } .n { color: var(--warn); } .b { color: var(--bad); }
  .kv { display: grid; grid-template-columns: 130px 1fr; gap: 6px 14px; margin-bottom: 14px; }
  .kv div:nth-child(odd) { color: var(--muted); }
  .note { font-size: 12.5px; color: var(--muted); margin: 8px 2px 0; }
  .err { color: var(--bad); padding: 12px 16px; }
  input.search { width: min(520px, 100%); padding: 8px 12px; font-size: 14px; }
  .btn.danger { background: var(--bad); color: #fff; border: 0; }
  #danger[aria-pressed="true"] { background: var(--bad); color: #fff; border-color: var(--bad); }
  .strip { padding: 9px 12px; border-radius: 9px; margin-bottom: 12px; font-size: 13px; border: 1px solid var(--line); background: var(--bg); }
  .strip.bad { border-color: var(--bad); color: var(--bad); }
  .strip.ok { color: var(--ok); }
  dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--ink); padding: 20px; width: min(460px, 92vw); }
  dialog::backdrop { background: #0008; }
  dialog h3 { margin: 0 0 8px; }
  dialog .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  .ed { position: relative; height: 340px; border: 1px solid var(--line); border-radius: 9px; background: var(--bg); overflow: hidden; }
  .ed:focus-within { border-color: var(--accent); }
  .ed pre.hl, .ed textarea.edit { position: absolute; inset: 0; margin: 0; padding: 10px 12px; border: 0; font: 12.5px/1.5 var(--mono); white-space: pre; tab-size: 2; overflow: auto; width: 100%; height: 100%; }
  .ed pre.hl { overflow: hidden; pointer-events: none; }
  .ed textarea.edit { background: transparent; color: transparent; caret-color: var(--ink); resize: none; outline: 0; border-radius: 0; }
  .ed .errline { background: color-mix(in srgb, var(--bad) 14%, transparent); }
  .ed .errchar { background: var(--bad); color: #fff; border-radius: 2px; }
  .jsonmsg { margin-top: 8px; font-size: 13px; }
  .jsonmsg.bad { color: var(--bad); font-weight: 550; }
  .jsonmsg.ok { color: var(--ok); }
  textarea { width: 100%; font-family: var(--mono); font-size: 12.5px; min-height: 90px; resize: vertical; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } nav { border-right: 0; border-bottom: 1px solid var(--line); } }
</style>
</head>

<script>
"use strict";
/* Everything from the ledger is untrusted text: it is only ever written with textContent. */
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, props = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) if (v == null || v === false) continue; else k === "class" ? (e.className = v) : k.startsWith("on") ? e.addEventListener(k.slice(2), v) : e.setAttribute(k, v);
  for (const c of kids.flat()) if (c != null) e.append(c.nodeType ? c : document.createTextNode(String(c)));
  return e;
};
const store = { get: (k, d) => { try { return localStorage.getItem(k) ?? d; } catch { return d; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };

const hash = new URLSearchParams(location.hash.slice(1));
const state = { base: hash.get("base") || store.get("al.base", location.protocol.startsWith("http") ? location.origin : "http://127.0.0.1:5260"), view: hash.get("view") || store.get("al.view", "al"), db: hash.get("db"), dbs: [], tab: "streams", cursor: [null], page: 0, q: "", danger: false, pageSize: +store.get("al.pagesize", "50") || 50, sizes: {}, avg: {}, perStream: {}, exact: {} };
const PAGE_SIZES = [25, 50, 100, 200];
const fmtBytes = (n) => (typeof n !== "number" ? "" : n < 1024 ? n + " B" : n < 1048576 ? (n / 1024).toFixed(n < 10240 ? 1 : 0) + " KB" : n < 1073741824 ? (n / 1048576).toFixed(n < 10485760 ? 1 : 0) + " MB" : (n / 1073741824).toFixed(1) + " GB");

const api = async (path, opts) => {
  const r = await fetch(state.base.replace(/\/$/, "") + path, opts);
  if (!r.ok) throw new Error(r.status + " " + (await r.text()).slice(0, 200));
  return r.json();
};
/* The node\'s own databases (db.database, db.event, db.error and the error archive); anything else is custom. */
const SYSTEM = /^activeledger(events?|errors?(_archive)?)?$/;
const isSystem = (name) => SYSTEM.test(name);
const role = (name) => (!isSystem(name) ? "custom" : /event/.test(name) ? "events" : /error/.test(name) ? "errors" : "ledger");
const short = (s, n = 14) => (s && s.length > n * 2 + 1 ? s.slice(0, n) + "…" + s.slice(-6) : s);

/* JSON view and editor. Text is only ever added as text nodes. */
const TOKEN = /("(?:\\.|[^"\\])*")(\s*:)?|\b(true|false|null)\b|(-?\d+\.?\d*(?:[eE][+-]?\d+)?)/g;
const highlight = (text) => {
  const frag = document.createDocumentFragment();
  let last = 0, m; TOKEN.lastIndex = 0;
  while ((m = TOKEN.exec(text))) {
    frag.append(text.slice(last, m.index));
    frag.append(el("span", { class: m[1] ? (m[2] ? "k" : "s") : m[3] ? "b" : "n" }, m[1] ? m[1] + (m[2] ?? "") : m[0]));
    last = TOKEN.lastIndex;
  }
  frag.append(text.slice(last));
  return frag;
};
const jsonView = (value) => el("pre", { class: "json" }, highlight(JSON.stringify(value, null, 2) ?? "undefined"));
/* Where JSON.parse gave up: line, column and a plain message. */
const jsonError = (text) => {
  try { JSON.parse(text); return null; } catch (e) {
    let pos = text.length;
    const at = /position (\d+)/.exec(e.message), lc = /line (\d+) column (\d+)/.exec(e.message);
    if (at) pos = +at[1];
    else if (lc) pos = text.split("\n").slice(0, +lc[1] - 1).reduce((n, l) => n + l.length + 1, 0) + (+lc[2] - 1);
    pos = Math.min(pos, text.length);
    const before = text.slice(0, pos).split("\n");
    return { line: before.length, col: before[before.length - 1].length + 1, message: String(e.message).replace(/\s*(in JSON )?at position \d+.*$/, "").replace(/\s*\(line \d+ column \d+\)/, "").replace(/^JSON\.parse: /, "") };
  }
};
const paint = (text, err) => {
  const frag = document.createDocumentFragment(), lines = text.split("\n");
  lines.forEach((line, i) => {
    if (err && i + 1 === err.line) {
      const c = Math.min(err.col - 1, line.length);
      frag.append(el("span", { class: "errline" }, highlight(line.slice(0, c)), el("span", { class: "errchar" }, line[c] ?? " "), highlight(line.slice(c + 1))));
    } else frag.append(highlight(line));
    if (i < lines.length - 1) frag.append("\n");
  });
  frag.append("\n");
  return frag;
};
/* A textarea over a highlighted copy of its own text, checked as you type. onState(valid) says if Save is allowed. */
const jsonEditor = (text, onState) => {
  const hl = el("pre", { class: "hl", "aria-hidden": "true" });
  const ta = el("textarea", { class: "edit", spellcheck: "false", wrap: "off", "aria-label": "JSON" }); ta.value = text;
  const msg = el("div", { class: "jsonmsg" });
  const run = () => {
    const err = jsonError(ta.value);
    hl.replaceChildren(paint(ta.value, err));
    msg.className = "jsonmsg " + (err ? "bad" : "ok");
    msg.textContent = err ? `Line ${err.line}, column ${err.col}: ${err.message}` : "Valid JSON";
    onState(!err);
  };
  ta.addEventListener("input", run);
  ta.addEventListener("scroll", () => { hl.scrollTop = ta.scrollTop; hl.scrollLeft = ta.scrollLeft; });
  ta.addEventListener("keydown", (e) => { if (e.key === "Tab" && !e.shiftKey) { e.preventDefault(); ta.setRangeText("  ", ta.selectionStart, ta.selectionEnd, "end"); run(); } });
  const format = () => { try { ta.value = JSON.stringify(JSON.parse(ta.value), null, 2); run(); } catch {} };
  return { wrap: el("div", { class: "ed" }, hl, ta), msg, ta, run, format };
};

/* Drawer */
const drawer = { open(title, ...nodes) { $("#d-title").textContent = title; const b = $("#d-body"); b.replaceChildren(...nodes); $("#drawer").classList.add("open"); $("#drawer").setAttribute("aria-hidden", "false"); }, close() { $("#drawer").classList.remove("open"); $("#drawer").setAttribute("aria-hidden", "true"); } };
$("#d-close").onclick = drawer.close;
addEventListener("keydown", (e) => e.key === "Escape" && drawer.close());

/* Documents */
const listDocs = async (db, { startkey, endkey, limit = state.pageSize + 1, include_docs = true } = {}) => {
  const q = new URLSearchParams({ include_docs: String(include_docs), limit: String(limit) });
  if (startkey != null) q.set("startkey", JSON.stringify(startkey));
  if (endkey != null) q.set("endkey", JSON.stringify(endkey));
  const rows = (await api(`/${encodeURIComponent(db)}/_all_docs?${q}`)).rows || [];
  /* With include_docs this server answers with the documents themselves; without it, id/key/value rows. Both become { id, doc }. */
  if (include_docs && rows.length) {
    const t = (state.avg[db] ||= { bytes: 0, n: 0 });
    for (const r of rows) { t.bytes += JSON.stringify(r).length; t.n++; }
  }
  return rows.map((r) => (include_docs ? { id: r._id, doc: r } : { id: r.id ?? r._id, doc: r.doc }));
};
const getDoc = (db, id) => api(`/${encodeURIComponent(db)}/${encodeURIComponent(id)}`);

/* Activeledger stream = state + :stream meta + :volatile, shown as one thing */
const groupStreams = (rows) => {
  const map = new Map();
  for (const r of rows) {
    const doc = r.doc; if (!doc) continue;
    const id = String(doc._id);
    if (id.endsWith(":umid") || id.includes(":data")) continue;
    const base = id.replace(/:(stream|volatile)$/, "");
    const g = map.get(base) || { id: base };
    if (id.endsWith(":stream")) g.meta = doc; else if (id.endsWith(":volatile")) g.volatile = doc; else g.state = doc;
    map.set(base, g);
  }
  return [...map.values()];
};
const lockTags = (meta) => {
  const t = [];
  if (!meta) return t;
  if (meta.contractlock?.length) t.push(el("span", { class: "tag warn" }, "contract lock"));
  if (meta.namespaceLock?.length) t.push(el("span", { class: "tag warn" }, "namespace lock"));
  if (meta.readLock) t.push(el("span", { class: "tag warn" }, "read lock"));
  return t;
};
const openStream = async (db, g) => {
  let { state: s, meta, volatile: v } = g;
  try { s = s || await getDoc(db, g.id); } catch {}
  try { meta = meta || await getDoc(db, g.id + ":stream"); } catch {}
  try { v = v || await getDoc(db, g.id + ":volatile"); } catch {}
  const tabs = { State: s, Meta: meta, Volatile: v };
  const holder = el("div");
  const bar = el("div", { class: "tabs" });
  const show = (name) => { [...bar.children].forEach((b) => b.setAttribute("aria-selected", String(b.textContent === name))); holder.replaceChildren(tabs[name] ? docPanel(db, tabs[name], afterWrite) : el("div", { class: "empty" }, "Not held on this node", name === "Volatile" ? el("div", { style: "margin-top:10px" }, el("button", { class: "btn ghost", onclick: () => holder.replaceChildren(docPanel(db, { _id: g.id + ":volatile" }, afterWrite, true)) }, "Create volatile")) : null)); };
  Object.keys(tabs).forEach((n) => bar.append(el("button", { onclick: () => show(n) }, n)));
  const facts = el("div", { class: "kv" },
    el("div", {}, "Name"), el("div", {}, meta?.name ?? "—"),
    el("div", {}, "Created by"), el("div", { class: "mono" }, short(meta?.origin ?? "—", 18)),
    el("div", {}, "Last transaction"), el("div", { class: "mono" }, short(meta?.umid ?? "—", 18)),
    el("div", {}, "Authorities"), el("div", {}, String(meta?.authorities?.length ?? 0)),
    el("div", {}, "Revisions"), el("div", { class: "mono" }, `${s?._rev ?? "—"} · ${meta?._rev ?? "—"}`));
  drawer.open(g.id, facts, bar, holder);
  show("State");
};

/* Editing. open: a custom database, or :volatile (node-local). local: this node's own events and errors.
   consensus: everything else in the activeledger database; every node has to agree on it. */
const tier = (db, id) => (!isSystem(db) ? "open" : role(db) === "ledger" ? (/:volatile$/.test(String(id)) ? "open" : "consensus") : "local");
const ask = ({ title, body, expect, danger, field, check }) => new Promise((resolve) => {
  const d = $("#ask"), input = $("#ask-input"), yes = $("#ask-yes"), msg = $("#ask-msg");
  $("#ask-title").textContent = title; $("#ask-body").textContent = body; msg.textContent = "";
  const typed = !!(expect || field);
  input.style.display = typed ? "" : "none"; input.value = field ? field.start || "" : ""; input.placeholder = expect ? "Type " + expect + " to confirm" : field ? field.hint || "" : "";
  yes.className = danger ? "btn danger" : "btn"; yes.disabled = typed;
  input.oninput = () => {
    if (expect) return (yes.disabled = input.value !== expect);
    const err = check ? check(input.value) : ""; msg.textContent = input.value ? err : ""; yes.disabled = !input.value || !!err;
  };
  const done = (v) => { d.close(); resolve(v); };
  yes.onclick = () => done(field ? input.value : true); $("#ask-no").onclick = () => done(field ? null : false); d.oncancel = () => resolve(field ? null : false);
  d.showModal(); (typed ? input : yes).focus(); if (field) input.oninput();
});
const confirmWrite = (db, id, what) => {
  const t = tier(db, id);
  if (t === "open") return what === "Delete" ? ask({ title: "Delete " + short(String(id), 12) + "?", body: "This cannot be undone." }) : Promise.resolve(true);
  if (t === "local") return ask({ title: what + " in " + db + "?", body: "This is this node's own record. It is not part of consensus, but other tools on the node may read it." });
  return ask({ title: what + " consensus data?", body: "Every node must hold the same stream state and meta. Changing it here makes this node disagree with the network: it can fail votes, or be overwritten by a repair from the other nodes.", expect: String(id).replace(/:.*/, "").slice(-8), danger: true });
};
const JSON_HEADERS = { "Content-Type": "application/json" };
const save = async (db, doc, isNew) => {
  if (!isNew) return api(`/${encodeURIComponent(db)}/${encodeURIComponent(doc._id)}`, { method: "PUT", headers: JSON_HEADERS, body: JSON.stringify(doc) });
  /* No _id: let the store choose one. Otherwise write it as it is: a _rev in the JSON is kept exactly, and without one the store builds it. */
  if (!doc._id) return api(`/${encodeURIComponent(db)}`, { method: "POST", headers: JSON_HEADERS, body: JSON.stringify(doc) });
  const r = await api(`/${encodeURIComponent(db)}/_bulk_docs`, { method: "POST", headers: JSON_HEADERS, body: JSON.stringify({ docs: [doc], options: { new_edits: false } }) });
  if (r?.ok !== true) throw new Error("The store did not accept the document (is there already one with that _id?).");
  return r;
};
/* Delete, then create it again exactly as written. The only way to set a document's _rev; if the new one is refused the original goes back. */
const replaceKeepingRev = async (db, before, after) => {
  await api(`/${encodeURIComponent(db)}/${encodeURIComponent(before._id)}`, { method: "DELETE" });
  try { await save(db, after, true); } catch (e) {
    try { await save(db, before, true); } catch { throw new Error("The new document was refused and the original could not be put back. The original was: " + JSON.stringify(before)); }
    throw new Error("The new document was refused (" + (e.message || e) + "). The original was put back.");
  }
};
/* One document: its JSON, and Edit / Delete when allowed. `after` runs once something changed. */
const docPanel = (db, doc, after, isNew = false) => {
  const wrap = el("div"), t = tier(db, doc._id), locked = t === "consensus" && !state.danger;
  const show = () => {
    const strip = t === "consensus" ? el("div", { class: "strip bad" }, locked ? "Consensus data. Read only until Danger mode is on." : "Consensus data. Changes make this node disagree with the network.")
      : t === "local" ? el("div", { class: "strip" }, "This node's own record, not part of consensus.")
